# Test Compose for the celine-dion backend (project: celine-dion-test-backend).
#
# Isolated from production: no container_name, no Traefik labels, no published
# ports, no named or external resources. The production docker-compose.yml is
# NOT modified. Validate with:
#   docker compose -p celine-dion-test-backend -f docker-compose.test.yml config

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # No published ports: tests call the container through Docker networking or
    # a temporary ephemeral port mapped by the test harness.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
